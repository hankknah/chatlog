name: Release

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release Windows Binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # 安装Windows交叉编译工具链
      - name: Install Windows cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64

      # 构建whisper.cpp的Windows版本（使用兼容版本）
      - name: Build whisper.cpp for Windows
        run: |
          git clone https://github.com/ggerganov/whisper.cpp.git /tmp/whisper
          cd /tmp/whisper
          # 切换到较稳定的版本，避免新API问题
          git checkout v1.5.4
          mkdir build-windows
          cd build-windows
          
          # 使用mingw交叉编译，禁用可能有问题的功能
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_PREFIX=/usr/x86_64-w64-mingw32 \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DGGML_NATIVE=OFF
          
          make -j$(nproc) whisper
          sudo make install

      # 构建lame的Windows版本
      - name: Build lame for Windows
        run: |
          wget http://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
          tar -xzf lame-3.100.tar.gz
          cd lame-3.100
          
          ./configure \
            --host=x86_64-w64-mingw32 \
            --prefix=/usr/x86_64-w64-mingw32 \
            --enable-static \
            --disable-shared
          
          make -j$(nproc)
          sudo make install

      # 设置Windows CGO环境变量
      - name: Set Windows CGO environment
        run: |
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "CXX=x86_64-w64-mingw32-g++" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-I/usr/x86_64-w64-mingw32/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L/usr/x86_64-w64-mingw32/lib -lwhisper -lmp3lame -static" >> $GITHUB_ENV
          echo "GOOS=windows" >> $GITHUB_ENV
          echo "GOARCH=amd64" >> $GITHUB_ENV

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          version: v2.7.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}